tracked_plane_presence:
  # Was any tracked aircraft on the ground at any field in the list above,
  # inside the window? Three registers are searched and kept apart, strongest
  # first. NEVER collapse them into one number.
  window:
    from: 2024-09-01
    to: 2024-09-05
    days_each_side: 2
  any_found: true
  egyptian_su_found: false
  counts:
    adsb_ground_contacts: 1
    adsb_ground_contacts_egyptian_su: 0
    flights_csv_stays: 0
    flights_csv_stays_egyptian_su: 0
    claimed_overlaps: 0
  from_adsb_traces:
    - tail: N582MM
      registry: "United States"
      side: kirk
      aircraft_type: LJ60
      is_egyptian_su: false
      in_73_tally: false
      airport_code: KPHX
      airport_name: "Phoenix Sky Harbor International Airport"
      distance_from_arrival_airport_mi: 1.2
      median_distance_from_that_runway_km: 1.92
      date_utc: 2024-09-01
      gap_days_from_event: -2
      on_ground_first_utc: "2024-09-01T15:26:43.070000Z"
      on_ground_last_utc: "2024-09-01T16:08:38.560000Z"
      on_ground_first_local: "2024-09-01 08:26:43 MST"
      on_ground_last_local: "2024-09-01 09:08:38 MST"
      ground_positions: 101
      ground_minutes: 41.9
      adsb_sources:
        - adsbexchange-samples
      source_count: 1
      trace_files:
        - site/docs/Planes/N582MM/data/recovered/N582MM_2024-09-01_adsbexchange-samples_trace_full.json
      evidence_class: adsb_public_history
      # PRESENCE ONLY. A trace never establishes purpose and never establishes who was aboard.
      cross_source_agreement: "SINGLE SOURCE - not independently corroborated"
  from_flights_csv: []
  from_overlaps_csv: []
  just_outside_the_radius:
    # A hard radius creates a cliff and a cliff hides evidence. These fields
    # sit between 40 and 60 miles from the arrival airport. They are NOT counted
    # as hits and must never be published as ones - they are here so a near miss
    # is visible rather than silently dropped.
    outer_radius_miles: 60.0
    adsb_ground_contacts: []
    flights_csv_stays: []
    claimed_overlaps: []
  coverage:
    # AN EMPTY RESULT ABOVE IS NOT A FINDING UNLESS THIS SAYS THE DAYS WERE HELD.
    # aircraft_days_needed = tails x days in the window. aircraft_days_held is
    # how many of those this repo actually has a trace for. The rest were never
    # pulled, or the networks heard nothing - the two are indistinguishable here.
    aircraft_days_needed: 75
    aircraft_days_held: 3
    coverage_pct: 4.0
    tails_with_no_trace_in_window:
      - N1098L
      - N2100L
      - N40JD
      - N560TW
      - N59906
      - N872RA
      - SU-BGM
      - SU-BND
      - SU-BTT
      - SU-BTU
      - SU-BTV
      - T7-ELL
    by_side:
      following:
        # FOLLOWING is the side the claim is about - the Egyptian SU- tails.
        # This percentage is the one that decides whether an empty result means
        # anything at all.
        tails: 6
        aircraft_days_needed: 30
        aircraft_days_held: 0
        coverage_pct: 0.0
      kirk:
        # KIRK-side coverage is what turns an ESTIMATED arrival into an
        # OBSERVED one. Low here means the arrival times above stay estimates.
        tails: 6
        aircraft_days_needed: 30
        aircraft_days_held: 3
        coverage_pct: 10.0
      n1098l:
        # Other tracked aircraft. A DIFFERENT CLAIM - do not merge the threads.
        tails: 3
        aircraft_days_needed: 15
        aircraft_days_held: 0
        coverage_pct: 0.0
counterargument:
  - "ONE PAIRING IS NOT EVIDENCE. The claim under test is a repetition across many stops, and any single pairing has an innocent explanation a reader will find."
  - "A field inside the radius is a field a jet COULD have used. Nothing here shows that anyone did use it, or that two aircraft on one ramp had any connection."
  - "Maintenance is the strongest innocent explanation in this record: Duncan Aviation (Provo and Lincoln) and Yingling (Wichita) are Part 145 Falcon and Gulfstream shops, and a Falcon 7X sitting for weeks at one reads as a maintenance visit."
  - "Transatlantic customs and fuel stops explain the recurring East Coast fields."
  - "ERIKA'S SIDE IS THE WEAK SIDE. Her flight logs are reported erased, so any Erika pairing rests on the foreign aircraft's track plus a CLAIMED location for her. See /Planes/Erika-Flight-Logs-Erased."
what_we_do_not_know:
  - "Whether Charlie Kirk, Erika Kirk, or any TPUSA party actually flew to this event, or which aircraft they used. The arrival airport above is an inference from the venue city, not a record."
  - "Whether the estimated arrival and departure times are within hours or within days of the truth, wherever observed_by_adsb is empty."
  - "What the tracked aircraft were doing at any field they appear at. A trace proves presence, never purpose and never occupancy."
  - "Whether the receiver networks simply did not hear an aircraft that was there. See the coverage block - an absence is not a finding."
