tracked_plane_presence:
  # Was any tracked aircraft on the ground at any field in the list above,
  # inside the window? Three registers are searched and kept apart, strongest
  # first. NEVER collapse them into one number.
  window:
    from: 2024-10-20
    to: 2024-10-24
    days_each_side: 2
  any_found: false
  egyptian_su_found: false
  counts:
    adsb_ground_contacts: 0
    adsb_ground_contacts_egyptian_su: 0
    flights_csv_stays: 0
    flights_csv_stays_egyptian_su: 0
    claimed_overlaps: 0
  from_adsb_traces: []
  from_flights_csv: []
  from_overlaps_csv: []
  just_outside_the_radius:
    # A hard radius creates a cliff and a cliff hides evidence. These fields
    # sit between 40 and 60 miles from the arrival airport. They are NOT counted
    # as hits and must never be published as ones - they are here so a near miss
    # is visible rather than silently dropped.
    outer_radius_miles: 60.0
    adsb_ground_contacts: []
    flights_csv_stays: []
    claimed_overlaps: []
  coverage:
    # AN EMPTY RESULT ABOVE IS NOT A FINDING UNLESS THIS SAYS THE DAYS WERE HELD.
    # aircraft_days_needed = tails x days in the window.
    #   aircraft_days_held                     a trace is on disk
    #   aircraft_days_asked_and_archive_empty  the archive WAS asked and holds
    #                                          nothing for that aircraft-day
    #   aircraft_days_never_asked               nobody has queried it yet
    # Only the FIRST TWO are evidence of anything. The third is an open question,
    # and closing it is what fetch_event_windows.py is for. Even an asked-and-empty
    # day is NOT proof the aircraft was elsewhere: a volunteer receiver network
    # heard nothing, and transponder-off, out-of-coverage, and a wrong claimed date
    # all look identical from here.
    aircraft_days_needed: 85
    aircraft_days_held: 25
    aircraft_days_asked_and_archive_empty: 37
    aircraft_days_never_asked: 23
    coverage_pct: 29.4
    queried_pct: 72.9
    tails_with_no_trace_in_window:
      - N1098L
      - N2100L
      - N40JD
      - N59906
      - N888KG
      - SU-BGM
      - T7-ELL
    archive_control_test:
      # The control test, run 24 Aug 2026 over every 8th window day against two
      # aircraft with no connection to this case. Full record:
      # apis/public_open_source/data/recovery/archive_control_probe.json
      control_hit_pct_this_year: 94.4
      verdict: "ARCHIVE HEALTHY. Unrelated control aircraft return 94.4% for 2024, so an empty result here is a fact about the AIRCRAFT rather than about the archive. It is still not proof the aircraft was elsewhere: transponder off, outside receiver coverage, and a wrong claimed date all look identical from here."
    by_side:
      following:
        # FOLLOWING is the side the claim is about - the Egyptian SU- tails.
        # This percentage is the one that decides whether an empty result means
        # anything at all.
        tails: 6
        aircraft_days_needed: 30
        aircraft_days_held: 5
        aircraft_days_asked_and_archive_empty: 25
        aircraft_days_never_asked: 0
        coverage_pct: 16.7
        queried_pct: 100.0
      kirk:
        # KIRK-side coverage is what turns an ESTIMATED arrival into an
        # OBSERVED one. Low here means the arrival times above stay estimates.
        tails: 6
        aircraft_days_needed: 30
        aircraft_days_held: 18
        aircraft_days_asked_and_archive_empty: 12
        aircraft_days_never_asked: 0
        coverage_pct: 60.0
        queried_pct: 100.0
