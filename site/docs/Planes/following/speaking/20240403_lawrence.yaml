tracked_plane_presence:
  # Was any tracked aircraft on the ground at any field in the list above,
  # inside the window? Three registers are searched and kept apart, strongest
  # first. NEVER collapse them into one number.
  window:
    from: 2024-04-01
    to: 2024-04-05
    days_each_side: 2
  any_found: false
  egyptian_su_found: false
  counts:
    adsb_ground_contacts: 0
    adsb_ground_contacts_egyptian_su: 0
    flights_csv_stays: 0
    flights_csv_stays_egyptian_su: 0
    claimed_overlaps: 0
  from_adsb_traces: []
  from_flights_csv: []
  from_overlaps_csv: []
  just_outside_the_radius:
    # A hard radius creates a cliff and a cliff hides evidence. These fields
    # sit between 40 and 60 miles from the arrival airport. They are NOT counted
    # as hits and must never be published as ones - they are here so a near miss
    # is visible rather than silently dropped.
    outer_radius_miles: 60.0
    adsb_ground_contacts: []
    flights_csv_stays: []
    claimed_overlaps: []
  coverage:
    # AN EMPTY RESULT ABOVE IS NOT A FINDING UNLESS THIS SAYS THE DAYS WERE HELD.
    # aircraft_days_needed = tails x days in the window. aircraft_days_held is
    # how many of those this repo actually has a trace for. The rest were never
    # pulled, or the networks heard nothing - the two are indistinguishable here.
    aircraft_days_needed: 75
    aircraft_days_held: 7
    coverage_pct: 9.3
    tails_with_no_trace_in_window:
      - N102DZ
      - N40JD
      - N582MM
      - N59906
      - N888KG
      - SU-BGM
      - SU-BND
      - SU-BTV
    by_side:
      following:
        # FOLLOWING is the side the claim is about - the Egyptian SU- tails.
        # This percentage is the one that decides whether an empty result means
        # anything at all.
        tails: 6
        aircraft_days_needed: 30
        aircraft_days_held: 3
        coverage_pct: 10.0
      kirk:
        # KIRK-side coverage is what turns an ESTIMATED arrival into an
        # OBSERVED one. Low here means the arrival times above stay estimates.
        tails: 6
        aircraft_days_needed: 30
        aircraft_days_held: 2
        coverage_pct: 6.7
      n1098l:
        # Other tracked aircraft. A DIFFERENT CLAIM - do not merge the threads.
        tails: 3
        aircraft_days_needed: 15
        aircraft_days_held: 2
        coverage_pct: 13.3
counterargument:
  - "ONE PAIRING IS NOT EVIDENCE. The claim under test is a repetition across many stops, and any single pairing has an innocent explanation a reader will find."
  - "A field inside the radius is a field a jet COULD have used. Nothing here shows that anyone did use it, or that two aircraft on one ramp had any connection."
