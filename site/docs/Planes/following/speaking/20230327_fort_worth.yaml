        on_ground_last_utc: "2023-03-25T23:03:10.070000Z"
        on_ground_first_local: "2023-03-25 18:03:10 CDT"
        on_ground_last_local: "2023-03-25 18:03:10 CDT"
        ground_positions: 1
        ground_minutes: 0.0
